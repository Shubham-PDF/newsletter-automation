# --- GitHub release feeds. type gh_releases builds the .atom URL per repo. ---

- name: GitHub Releases Watchlist
  type: gh_releases
  weight: 1.0
  section_hint: launches
  repos:
    # orchestration / agents
    - langchain-ai/langchain
    - langchain-ai/langgraph
    - run-llama/llama_index
    - crewAIInc/crewAI
    - pydantic/pydantic-ai
    - microsoft/autogen
    - openai/openai-agents-python
    # serving / inference
    - vllm-project/vllm
    - ollama/ollama
    - sgl-project/sglang
    - BerriAI/litellm
    - huggingface/text-generation-inference
    # RAG / retrieval / vector
    - infiniflow/ragflow
    - chroma-core/chroma
    - qdrant/qdrant
    - weaviate/weaviate
    # protocol / tooling
    - modelcontextprotocol/servers
    - modelcontextprotocol/python-sdk
    - stanfordnlp/dspy
    - unslothai/unsloth
    # automation platforms — your delivery stack
    - n8n-io/n8n
    - temporalio/temporal
    - PostHog/posthog
    - apache/airflow
    # observability / eval
    - langfuse/langfuse
    - Arize-ai/phoenix
    - confident-ai/deepeval

