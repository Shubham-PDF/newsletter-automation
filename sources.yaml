# BUILDR.ai source registry
#
# Every collector is driven by this file. Adding a source = adding a block here,
# never editing Python.
#
# FIELDS
#   name          Display name. Must be unique — used as the manifest key.
#   type          rss | hn_algolia | gh_releases | openrouter | hf_api | reddit | sitemap
#   url           Endpoint. Ignored for types that build their own URL.
#   weight        0.0-1.0 source authority. Feeds the ranking formula.
#                 1.0  = first-party announcement (vendor blog, release feed)
#                 0.8  = high-quality independent analysis
#                 0.6  = tech press / aggregator
#                 0.4  = high-noise, needs the score threshold to earn its place
#   section_hint  launches | business | crisis | headtohead | learning
#                 A hint for the editor LLM, NOT a hard assignment.
#   vertical      Optional. real_estate | healthcare | finance | legal | ecommerce |
#                 manufacturing | retail | supply_chain
#   enabled       false to park a source without deleting it.
#   notes         Free text.
#
# VERIFY BEFORE TRUSTING
#   These URLs were written from prior knowledge and feed endpoints move.
#   Run `python tools/verify_sources.py` before the first real run and after any
#   edit. Anything returning non-200 or zero parsed entries gets enabled: false
#   with a note, not a silent zero in your candidate pool.

# ---------------------------------------------------------------------------
# LAUNCHES — first-party. Highest weight because there is no press lag and no
# interpretation layer between the announcement and you.
# ---------------------------------------------------------------------------

- name: OpenAI News
  type: rss
  url: https://openai.com/news/rss.xml
  weight: 1.0
